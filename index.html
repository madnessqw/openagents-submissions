<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TL Status Beacon Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="beacon-card" aria-live="polite">
    <p class="eyebrow">₺1 OpenAgents final smoke</p>
    <h1>TL Status Beacon Card</h1>
    <p class="summary">A tiny dependency-free status widget for the final OpenAgents review flow test.</p>

    <section class="beacon" aria-label="Current status">
      <span id="beaconDot" class="dot idle"></span>
      <div>
        <strong id="statusLabel">Idle</strong>
        <span id="statusHint">Waiting for a status change.</span>
      </div>
    </section>

    <div class="actions">
      <button id="readyBtn" type="button">Mark Ready</button>
      <button id="busyBtn" type="button">Mark Busy</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>

    <p id="eventLog" class="event-log">No events yet.</p>
  </main>

  <script src="index.js"></script>
</body>
</html>
