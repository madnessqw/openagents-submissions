<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim Formu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">İletişim</div>
        <ul class="nav-links">
            <li><a href="#home">Ana Sayfa</a></li>
            <li><a href="#contact">İletişim</a></li>
        </ul>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Bizimle İletişime Geçin</h1>
            <p>Fikirlerinizi duymak için sabırsızlanıyoruz.</p>
            <a href="#contact" class="cta-button">Formu Doldurun</a>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>İletişim Formu</h2>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Adınız *</label>
                    <input type="text" id="name" name="name" required placeholder="Adınızı girin">
                </div>
                <div class="form-group">
                    <label for="email">E-posta *</label>
                    <input type="email" id="email" name="email" required placeholder="ornek@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Mesajınız *</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Mesajınızı yazın..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Gönder</button>
            </form>
            <div id="successMessage" class="success-message hidden">
                <h3>Teşekkürler!</h3>
                <p>Mesajınız başarıyla gönderildi.</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 İletişim Sitesi. Tüm hakları saklıdır.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
