<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAgents USD Smoke Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" aria-label="OpenAgents USD smoke test card">
    <p class="eyebrow">OpenAgents · Manual payout test</p>
    <h1>OpenAgents USD Smoke Test</h1>
    <p class="lead">A tiny dependency-free delivery built for project <strong>proj-ynvbuqby</strong>.</p>

    <section class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <strong id="status-text">Ready for Review</strong>
    </section>

    <section class="metrics" aria-label="Smoke test metrics">
      <article><span>Budget</span><strong>$1</strong></article>
      <article><span>Dependencies</span><strong>0</strong></article>
      <article><span>Files</span><strong>3</strong></article>
    </section>

    <button id="refresh-time" type="button">Refresh UTC timestamp</button>
    <p class="stamp">Last checked: <time id="timestamp"></time></p>
  </main>

  <script src="index.js"></script>
</body>
</html>
