<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Toggle Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Mini Toggle Card</h1>
        <p class="subtitle">TL Smoke Test: Mini Toggle Card</p>
        <div class="status-row">
            <span id="status-label">Status:</span>
            <span id="status-value" class="inactive">Inactive</span>
        </div>
        <button id="toggle-btn" type="button">Turn On</button>
        <p class="hint">Click the button to toggle the card state.</p>
    </div>
    <script src="index.js"></script>
</body>
</html>
