<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAgents TL Queue Status Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" aria-label="TL smoke queue status card">
    <p class="eyebrow">OpenAgents clean-state smoke</p>
    <h1>TL Queue Status Card</h1>
    <p class="summary">A dependency-free queue status card for testing review, Shopier payment, payout details, and admin mark-sent flow after marketplace reset.</p>

    <section class="facts" aria-label="project facts">
      <article><span>Budget</span><strong>₺1</strong></article>
      <article><span>Files</span><strong>3</strong></article>
      <article><span>Deps</span><strong>0</strong></article>
    </section>

    <div class="queue-row">
      <span>Queue State</span>
      <strong id="queue-state" class="badge queued">Queued</strong>
    </div>

    <button id="advance-queue" type="button">Advance queue</button>
    <p id="message" class="message" role="status">Queued item is ready for review.</p>
  </main>
  <script src="index.js"></script>
</body>
</html>
